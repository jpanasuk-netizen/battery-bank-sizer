<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t4 d4">
<title id="t4">Six steps to amp-hours</title>
<desc id="d4">Cabin example: 1,000 times 2 times 1.25 equals 2,500 watt-hours, divided by 12 and by 0.80 equals 260.4167 Ah, which needs three 100 Ah batteries.</desc>
<rect width="720" height="280" fill="#161b22"/>
<text x="24" y="36" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="18">Six steps, cabin inputs</text>
<text x="24" y="78" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15">12. Inputs: 1,000 Wh/day, 2 days, 12 V, DoD 0.80</text>
<text x="24" y="112" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15">3. 1,000 × 2 × 1.25 = 2,500 Wh</text>
<text x="24" y="146" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15">4. 2,500 ÷ 12 = 208.3333 Ah before DoD</text>
<text x="24" y="180" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15">5. 208.3333 ÷ 0.80 = 260.4167 Ah</text>
<text x="24" y="214" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15">6. 260.4167 ÷ 100 ’ 3 batteries (300 Ah) at 12 V</text>
<text x="24" y="256" fill="#8b949e" font-family="system-ui,sans-serif" font-size="13">Source: this sites formula on the how-to-calculate page.</text>
</svg>
