<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t1 d1">
<title id="t1">Ah formula flow</title>
<desc id="d1">Wh per day times autonomy days times 1.25, divided by voltage, divided by depth of discharge, equals amp-hours.</desc>
<rect width="720" height="280" fill="#161b22"/>
<text x="24" y="36" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="18">Ah formula</text>
<rect x="24" y="64" width="150" height="72" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="99" y="94" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Wh/day</text>
<text x="99" y="116" fill="#8b949e" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">× days × 1.25</text>
<text x="190" y="106" fill="#f78166" font-family="system-ui,sans-serif" font-size="22">’</text>
<rect x="214" y="64" width="130" height="72" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="279" y="106" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">÷ voltage</text>
<text x="360" y="106" fill="#f78166" font-family="system-ui,sans-serif" font-size="22">’</text>
<rect x="384" y="64" width="120" height="72" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="444" y="106" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">÷ DoD</text>
<text x="520" y="106" fill="#f78166" font-family="system-ui,sans-serif" font-size="22">’</text>
<rect x="544" y="64" width="152" height="72" rx="8" fill="#0d1117" stroke="#3fb950"/>
<text x="620" y="106" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Ah</text>
<text x="24" y="180" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15">Cabin inputs already on this site: 1,000 Wh/day, 2 days, 12 V, 0.80</text>
<text x="24" y="208" fill="#8b949e" font-family="system-ui,sans-serif" font-size="15">(1,000 × 2 × 1.25) ÷ 12 ÷ 0.80 = 260.4167 Ah</text>
<text x="24" y="248" fill="#8b949e" font-family="system-ui,sans-serif" font-size="13">Source: this sites formula. Not a manufacturer watt-hour rating.</text>
</svg>
