<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t3 d3">
<title id="t3">Two 100 Ah batteries in parallel or in series</title>
<desc id="d3">Parallel is 12 V, 200 Ah, 200 A continuous. Series is 24 V, 100 Ah.</desc>
<rect width="720" height="300" fill="#161b22"/>
<text x="24" y="34" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="18">Two 100 Ah batteries</text>
<rect x="36" y="58" width="310" height="170" rx="8" fill="#0d1117" stroke="#3fb950"/>
<text x="191" y="90" fill="#3fb950" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Parallel</text>
<rect x="70" y="110" width="100" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="120" y="140" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">100 Ah</text>
<rect x="190" y="110" width="100" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="240" y="140" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">100 Ah</text>
<text x="191" y="196" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">12 V · 200 Ah · 200 A</text>
<rect x="374" y="58" width="310" height="170" rx="8" fill="#0d1117" stroke="#f78166"/>
<text x="529" y="90" fill="#f78166" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Series</text>
<rect x="470" y="108" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="530" y="134" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">100 Ah</text>
<rect x="470" y="156" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="530" y="182" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">100 Ah</text>
<text x="24" y="262" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15">Series result: 24 V, 100 Ah. Amp-hours do not add.</text>
<text x="24" y="286" fill="#8b949e" font-family="system-ui,sans-serif" font-size="13">Source: Battle Born parallel example, as quoted on this page.</text>
</svg>
